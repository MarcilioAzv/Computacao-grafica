<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Jogo de Física - Three.js</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="crosshair" style="
    position: fixed;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    transform: translate(-50%, -50%);
    pointer-events: none; /* Garante que a mira não intercepte cliques do mouse */
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
">
        <div style="width: 4px; height: 4px; background-color: red; border-radius: 50%;"></div>

        <div style="position: absolute; width: 2px; height: 10px; background-color: lime; top: -12px;"></div>
        <div style="position: absolute; width: 2px; height: 10px; background-color: lime; bottom: -12px;"></div>
        <div style="position: absolute; width: 10px; height: 2px; background-color: lime; left: -12px;"></div>
        <div style="position: absolute; width: 10px; height: 2px; background-color: lime; right: -12px;"></div>
    </div>
    <!-- RELATÓRIO BALÍSTICO -->
    <div id="ballistics-overlay">
        <div id="ballistics-panel">
            <div class="bp-header">
                <div>
                    <h2>Relatório Balístico</h2>
                    <span id="bp-subtitle">Trajetória Finalizada</span>
                </div>
            </div>
            <div class="bp-metrics">
                <div class="bp-metric">
                    <div class="label">Distância Total</div>
                    <div class="value" id="bp-distance">—</div><span class="unit">m</span>
                </div>
                <div class="bp-metric">
                    <div class="label">Altura máx.</div>
                    <div class="value" id="bp-maxheight">—</div><span class="unit">m</span>
                </div>
                <div class="bp-metric">
                    <div class="label">Vel. inicial</div>
                    <div class="value" id="bp-v0">—</div><span class="unit">m/s</span>
                </div>
                <div class="bp-metric">
                    <div class="label">Resultado</div>
                    <div class="value" id="bp-hit" style="font-size:13px;padding-top:4px">—</div>
                </div>
            </div>
            <div style="padding: 0 20px 4px;">
                <div class="bp-section-title" style="padding-left:0">Altura × Distância</div>
                <div style="height: 180px; background:#0d0d1f; border-radius:8px; padding:10px;">
                    <canvas id="bp-chart-alt"></canvas>
                </div>
            </div>

            <div style="padding: 8px 20px 4px;">
                <div class="bp-section-title" style="padding-left:0">Velocidade × Tempo</div>
                <div style="height: 180px; background:#0d0d1f; border-radius:8px; padding:10px;">
                    <canvas id="bp-chart-vel"></canvas>
                </div>
            </div>
            <div class="bp-footer">
                <span class="note" id="bp-time-note">Tempo de Voo: —</span>
                <button class="bp-btn-reset"
                    onclick="event.stopPropagation(); document.getElementById('ballistics-overlay').classList.remove('visible'); if(window.forcarResetDaCena) window.forcarResetDaCena();">
                    ↺ Atirar Novamente
                </button>
            </div>
        </div>
    </div>
    <!-- Import Maps ajuda o navegador a entender o Three.js sem precisar de instalação complexa agora -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

    <script>
        let chartAlt = null;
        let chartVel = null;

    window.mostrarRelatorio = function (samples, acertou) {
    if (!samples || samples.length === 0) return;
    
    if (window.plotarGrafico === false) {
        if (window.forcarResetDaCena) window.forcarResetDaCena();
        return;
    }

    const first = samples[0];
    const last = samples[samples.length - 1];
    const maxH = Math.max(...samples.map(s => s.y));
    const totalDist = Math.abs(last.z);
    const totalTime = last.t;

    document.getElementById('bp-distance').textContent = totalDist.toFixed(1);
    document.getElementById('bp-maxheight').textContent = maxH.toFixed(1);
    document.getElementById('bp-v0').textContent = first.spd.toFixed(1);
    document.getElementById('bp-time-note').textContent = 'Tempo de Voo: ' + totalTime.toFixed(2) + 's';
    document.getElementById('bp-subtitle').textContent = new Date().toLocaleTimeString('pt-BR');

    const hitEl = document.getElementById('bp-hit');
    hitEl.innerHTML = acertou
        ? '<span class="hit-badge">✓ Acerto</span>'
        : '<span class="miss-badge">✗ Erro</span>';

    // ── Pega os dois blocos de gráfico pelo título ──
    const blocoAlt = document.getElementById('bp-chart-alt').closest('div[style]').parentElement;
    const blocoVel = document.getElementById('bp-chart-vel').closest('div[style]').parentElement;

    if (window.plotarGrafico === false) {
        // Esconde os gráficos e abre o painel sem eles
        blocoAlt.style.display = 'none';
        blocoVel.style.display = 'none';
    } else {
        // Mostra os gráficos normalmente
        blocoAlt.style.display = '';
        blocoVel.style.display = '';

        if (chartAlt) { chartAlt.destroy(); chartAlt = null; }
        if (chartVel) { chartVel.destroy(); chartVel = null; }

        const distBase = Math.abs(first.z);

        const dataAlt = samples.map(s => ({
            x: parseFloat(Math.abs(Math.abs(s.z) - distBase).toFixed(2)),
            y: parseFloat(s.y.toFixed(2))
        }));

        const dataVel = samples.map(s => ({
            x: parseFloat(s.t.toFixed(2)),
            y: parseFloat(s.spd.toFixed(2))
        }));

        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 400 },
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: '#1a1a2e',
                    borderColor: '#378ADD',
                    borderWidth: 1,
                    titleColor: '#85B7EB',
                    bodyColor: '#ddd',
                    padding: 10
                }
            },
            scales: {
                x: {
                    type: 'linear',
                    grid: { color: 'rgba(255,255,255,0.07)' },
                    ticks: { color: '#888', font: { size: 11 } },
                    border: { color: '#333' }
                },
                y: {
                    grid: { color: 'rgba(255,255,255,0.07)' },
                    ticks: { color: '#888', font: { size: 11 } },
                    border: { color: '#333' }
                }
            }
        };

        chartAlt = new Chart(document.getElementById('bp-chart-alt'), {
            type: 'line',
            data: {
                datasets: [{
                    data: dataAlt,
                    borderColor: '#378ADD',
                    backgroundColor: 'rgba(55,138,221,0.12)',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                ...commonOptions,
                plugins: {
                    ...commonOptions.plugins,
                    tooltip: {
                        ...commonOptions.plugins.tooltip,
                        callbacks: {
                            title: items => `Distância: ${items[0].parsed.x} m`,
                            label: item => `Altura: ${item.parsed.y} m`
                        }
                    }
                },
                scales: {
                    ...commonOptions.scales,
                    x: { ...commonOptions.scales.x, title: { display: true, text: 'Distância (m)', color: '#888', font: { size: 11 } } },
                    y: { ...commonOptions.scales.y, title: { display: true, text: 'Altura (m)', color: '#888', font: { size: 11 } } }
                }
            }
        });

        chartVel = new Chart(document.getElementById('bp-chart-vel'), {
            type: 'line',
            data: {
                datasets: [{
                    data: dataVel,
                    borderColor: '#1D9E75',
                    backgroundColor: 'rgba(29,158,117,0.12)',
                    borderWidth: 2,
                    pointRadius: 2,
                    pointHoverRadius: 5,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                ...commonOptions,
                plugins: {
                    ...commonOptions.plugins,
                    tooltip: {
                        ...commonOptions.plugins.tooltip,
                        callbacks: {
                            title: items => `Tempo: ${items[0].parsed.x} s`,
                            label: item => `Velocidade: ${item.parsed.y} m/s`
                        }
                    }
                },
                scales: {
                    ...commonOptions.scales,
                    x: { ...commonOptions.scales.x, title: { display: true, text: 'Tempo (s)', color: '#888', font: { size: 11 } } },
                    y: { ...commonOptions.scales.y, title: { display: true, text: 'Velocidade (m/s)', color: '#888', font: { size: 11 } } }
                }
            }
        });
    }

    document.getElementById('ballistics-overlay').classList.add('visible');
};
    </script>
    <script type="module" src="main.js"></script>
    <script type="module" src="interface.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</body>

</html>
